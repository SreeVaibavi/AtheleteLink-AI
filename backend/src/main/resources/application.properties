# AthleteLink AI - local demo configuration
server.port=8880
athletelink.public-base-url=${PUBLIC_BASE_URL:http://localhost:8880}

# MySQL (override with DB_URL / DB_USERNAME / DB_PASSWORD when needed)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/athletelink_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234567}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=5000

# JWT - set JWT_SECRET in your environment/.env for deployments
jwt.secret=${JWT_SECRET:this-is-a-development-only-secret-please-change-me-before-deploying-1234567890}
jwt.expiration-ms=86400000

# Same-origin frontend; these also permit common local development origins
app.cors.allowed-origins=http://localhost:8880,http://127.0.0.1:8880

logging.level.org.springframework.security=INFO
logging.level.com.athletelink=INFO
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Schema is maintained by database/schema.sql and safe runtime table creation/migrations.
spring.sql.init.mode=never

# Optional SMTP. Leave MAIL_HOST blank for a local confirmation-link fallback.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
athletelink.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
# For Gmail use an App Password, not your normal account password.
