# AthleteLink AI - Cloud & Local Configuration
server.port=${PORT:8080}
athletelink.public-base-url=${PUBLIC_BASE_URL:http://localhost:${PORT:8080}}

# MySQL - Railway provides MYSQL_URL, DB_URL, or use MYSQLDATABASE env vars
spring.datasource.url=${DB_URL:${MYSQL_URL:${MYSQLDATABASE:jdbc:mysql://127.0.0.1:3306/athletelink_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:1234567}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.maximum-pool-size=5

# JWT - set JWT_SECRET in Railway environment variables
jwt.secret=${JWT_SECRET:this-is-a-development-only-secret-please-change-me-before-deploying-1234567890}
jwt.expiration-ms=86400000

# CORS - Allow deployed domain and localhost
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:8880,http://127.0.0.1:8880}

logging.level.org.springframework.security=INFO
logging.level.com.athletelink=INFO
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Schema is maintained by database/schema.sql and safe runtime table creation/migrations.
spring.sql.init.mode=never

# SMTP email delivery (Gmail App Password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:sreevaib@gmail.com}
spring.mail.password=${MAIL_PASSWORD:phwdhylqwwqmzaat}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
athletelink.mail.from=${MAIL_FROM:${MAIL_USERNAME:sreevaib@gmail.com}}


